spring:
  application:
    name: promo-quoter
  datasource:
    url: jdbc:h2:mem:promoquoter;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %applicationName%clr([%15.15t]){faint} %clr([%X{requestId:-}]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%replace(%kvp){'^(?=.)',' '}%n%wEx"
